<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>树状历史 | Tree Style History</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <section class="controls" aria-label="History filters">
            <div class="quick-ranges" role="group" aria-label="Quick date ranges">
                <span class="control-caption" data-i18n="quickRange">快速范围</span>
                <button class="chip" type="button" data-range="today" data-i18n="today">今天</button>
                <button class="chip" type="button" data-range="yesterday" data-i18n="yesterday">昨天</button>
                <button class="chip" type="button" data-range="7" data-i18n="last7">最近 7 天</button>
                <button class="chip" type="button" data-range="30" data-i18n="last30">最近 30 天</button>
            </div>
            <div class="filter-grid">
                <div class="range-field">
                    <span data-i18n="dateRange">日期范围</span>
                    <button type="button" id="date-range-button" class="range-button" aria-haspopup="dialog" aria-expanded="false">
                        <span id="date-range-label"></span><span class="range-chevron" aria-hidden="true">▾</span>
                    </button>
                    <div id="date-picker" class="range-popover" role="dialog" aria-label="Date range picker" hidden></div>
                    <input type="hidden" id="start-date"><input type="hidden" id="end-date">
                </div>
                <label class="limit-field">
                    <span data-i18n="maxResults">每日最多访问</span>
                    <input type="number" id="max-results" value="300" min="10" max="10000" step="10" aria-describedby="limit-hint">
                    <small id="limit-hint"></small>
                </label>
                <label class="search-field"><span data-i18n="search">搜索</span><input type="search" id="search-input" placeholder="标题或网址" data-i18n-placeholder="searchPlaceholder"></label>
            </div>
            <div class="control-footer">
                <div class="check-stack"><label class="check-label"><input type="checkbox" id="filter-duplicates" checked><span data-i18n="hideDuplicates">隐藏连续重复</span></label><label class="check-label"><input type="checkbox" id="unlimited-results"><span data-i18n="loadAll">加载全部历史</span></label></div>
                <div class="button-group">
                    <button class="text-button" type="button" id="collapse-button" data-i18n="collapseAll">全部折叠</button>
                    <button class="text-button" type="button" id="expand-button" data-i18n="expandAll">全部展开</button>
                    <button class="primary-button" type="button" id="refresh-button" data-i18n="refresh">刷新历史</button>
                </div>
            </div>
        </section>
        <section class="results-head">
            <div id="summary" aria-live="polite"></div>
            <div id="loading" class="loading" role="status" hidden><span class="spinner"></span><span data-i18n="loading">正在读取历史…</span></div>
        </section>
        <section id="history-tree" aria-live="polite"></section>
        <div id="older-history" class="older-history" hidden>
            <button type="button" id="load-previous-day" class="older-button" data-i18n="loadPreviousDay">加载前一天</button>
        </div>
    </main>
    <div id="selection-actions" class="selection-actions" role="toolbar" aria-live="polite" hidden>
        <span id="selection-count"></span>
        <button type="button" id="open-selected-button" class="secondary-button" data-i18n="openSelected">全部打开</button>
        <button type="button" id="delete-button" class="danger-button" data-i18n="deleteSelected">删除选中</button>
    </div>
    <script src="history.js"></script>
</body>
</html>
